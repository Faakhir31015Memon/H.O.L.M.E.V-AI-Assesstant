services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: holmev
      POSTGRES_PASSWORD: holmev_dev
      POSTGRES_DB: holmev
    ports:
      - "5432:5432"
    volumes:
      - holmev_pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  holmev_pg:
